<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#262626" stroke-width="4" />

  <!-- Radar circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="50" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.45" />

  <!-- Radar crosshairs -->
  <line x1="66" y1="256" x2="446" y2="256" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />
  <line x1="256" y1="66" x2="256" y2="446" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />

  <!-- Falcon / Raptor Silhouette in Gold -->
  <path d="M 256 120 
           C 246 160 216 195 160 210 
           C 110 223 60 215 40 205
           C 65 240 115 265 170 268
           C 140 282 110 288 80 286
           C 105 305 140 315 185 310
           C 205 325 220 350 230 395
           L 242 415
           L 256 370
           L 270 415
           L 282 395
           C 292 350 307 325 327 310
           C 372 315 407 305 432 286
           C 402 288 372 282 342 268
           C 397 265 447 240 472 205
           C 452 215 402 223 352 210
           C 296 195 266 160 256 120 Z" 
        fill="url(#gold)" />

  <!-- Optic reticle target pip -->
  <circle cx="256" cy="256" r="8" fill="#fbbf24" />
  <circle cx="256" cy="256" r="18" fill="none" stroke="#fbbf24" stroke-width="3" />
</svg>
